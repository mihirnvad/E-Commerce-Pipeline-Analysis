[flake8]
max-line-length = 120
extend-ignore = E203
exclude = .git,__pycache__,.venv,venv,build,dist,.scrapy

[tool:pytest]
# `scraper_engine` (outer dir) makes the Scrapy package importable as `scraper_engine`;
# `.` makes `analysis` and `scripts` importable.
pythonpath = scraper_engine .
testpaths = tests
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning:twisted.*
